plugins {
    id 'com.android.library'
}

android {
    namespace "com.micorlov.blackjack21_v2.extras"

    def unityLib = project(':unityLibrary').extensions.getByName('android')
    compileSdkVersion unityLib.compileSdkVersion
    buildToolsVersion unityLib.buildToolsVersion

    defaultConfig {
        minSdkVersion 25
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // In-app review card, called from src/main/java/.../PlayReview.java. Never add the old monolithic play:core.
    implementation 'com.google.android.play:review:2.0.2'
    // Native Google sign-in (GoogleIdToken.java): Credential Manager's account picker returns a Google ID token for Firebase.
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
