<!--
  Caption frame for a Play Store screenshot.

  Rendered headless at the target size with the raw device capture as
  ?shot=<file>&caption=<text>. The caption band sits above the capture so the
  benefit is legible in the store's small thumbnail strip, where the app's own
  UI text is far too small to read.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 2340px; overflow: hidden; }
  .frame {
    width: 1080px; height: 2340px;
    background: radial-gradient(ellipse at 50% 0%, #1b6b4f 0%, #0e4433 45%, #07271d 100%);
    display: flex; flex-direction: column; align-items: center;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .caption {
    height: 300px; width: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 0 70px; text-align: center;
  }
  .caption h2 {
    font-size: 74px; line-height: 1.12; letter-spacing: -1.5px;
    color: #fff; font-weight: 700; text-shadow: 0 4px 18px rgba(0,0,0,.45);
  }
  .caption h2 .gold { color: #e8b64c; }
  .shot {
    width: 940px; flex: 1;
    border-radius: 34px; overflow: hidden;
    box-shadow: 0 26px 60px rgba(0,0,0,.55);
    border: 2px solid rgba(232,182,76,.35);
    background: #0b0f0d;
  }
  .shot img { width: 100%; display: block; }
  .pad { height: 46px; }
</style>
<div class="frame">
  <div class="caption"><h2 id="cap"></h2></div>
  <div class="shot"><img id="img" alt=""></div>
  <div class="pad"></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('img').src = q.get('shot') || '';
  // "word|word" marks the gold half of the caption.
  const raw = q.get('caption') || '';
  document.getElementById('cap').innerHTML = raw.includes('|')
    ? raw.split('|')[0] + '<span class="gold">' + raw.split('|')[1] + '</span>'
    : raw;
</script>
