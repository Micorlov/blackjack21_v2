<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  .wrap {
    width: 1024px; height: 500px;
    background:
      radial-gradient(ellipse at 30% 40%, #1b6b4f 0%, #0e4433 55%, #07271d 100%);
    display: flex; align-items: center; gap: 56px;
    padding: 0 72px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    position: relative;
  }
  .wrap::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 6px);
  }
  .cards { position: relative; width: 260px; height: 300px; flex: none; }
  .card {
    position: absolute; width: 160px; height: 226px; border-radius: 14px;
    background: #fdfdf8; box-shadow: 0 18px 40px rgba(0,0,0,.45);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 14px 16px; font-weight: 700;
  }
  .card.back { left: 0; top: 46px; transform: rotate(-13deg); }
  .card.front { left: 78px; top: 22px; transform: rotate(7deg); }
  .pip { font-size: 34px; line-height: 1; }
  .mid { font-size: 74px; text-align: center; line-height: 1; }
  .black { color: #12151a; }
  .red { color: #c0202f; }
  .flip { transform: rotate(180deg); align-self: flex-end; }
  .copy { position: relative; z-index: 1; }
  h1 {
    font-size: 92px; letter-spacing: -2px; line-height: .96; color: #fff;
    text-shadow: 0 4px 18px rgba(0,0,0,.5);
  }
  h1 .gold { color: #e8b64c; display: block; }
  p { margin-top: 22px; font-size: 30px; color: #cfe4d8; line-height: 1.34; }
</style>
<div class="wrap">
  <div class="cards">
    <div class="card back">
      <div class="pip black">A<div style="font-size:24px">&spades;</div></div>
      <div class="mid black">&spades;</div>
      <div class="pip black flip">A<div style="font-size:24px">&spades;</div></div>
    </div>
    <div class="card front">
      <div class="pip red">K<div style="font-size:24px">&hearts;</div></div>
      <div class="mid red">&hearts;</div>
      <div class="pip red flip">K<div style="font-size:24px">&hearts;</div></div>
    </div>
  </div>
  <div class="copy">
    <h1>Blackjack<span class="gold">21</span></h1>
    <p>Beat the dealer. Sweep the pot.<br>Climb the world leaderboard.</p>
  </div>
</div>
